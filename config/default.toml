# =====================================================================
# A股规律库 —— 预注册参数（Pre-registration）
#
# 规则：跑真实数据之前把参数定死在这里并提交到 git。
# 看完结果再改参数 = 过拟合。确实需要改，必须：
#   1) 在 docs/protocol.md 的“参数变更记录”里写明原因；
#   2) 报告里同时保留原参数的结果（稳健性检验），不能只留好看的那组。
# =====================================================================

[data]
dir = "data"
# 数据从 2014 年开始取，留一年给滚动窗口预热；研究样本从 2015 年开始
study_start = "2015-01-01"
study_end = "2026-12-31"
# 市场基准：中证全指（覆盖全A，比上证指数更能代表全市场）
market_index = "000985"
# 全A成交额分母：用31个申万一级行业成交额之和（口径与分子一致）
total_amount_source = "sector_sum"

[common]
# 信号在 t 日收盘确认；entry_lag=1 表示 t+1 日收盘入场（保守、可执行）
# entry_lag=0 表示 t 日收盘入场（尾盘可近似实现，但偏乐观）
entry_lag = 1
horizons = [5, 10, 20, 60]
n_boot = 2000
n_perm = 2000
seed = 20150101
# 样本前后两段的分割点：结论必须在两段中方向一致才算稳健
split_date = "2020-12-31"
# 多重检验：Benjamini-Hochberg 控制的 FDR 水平
fdr_alpha = 0.10
# 证据等级门槛
grade_a_min_n = 20
grade_b_min_n = 10
grade_min_n = 5
# 滚动分位数（避免前视：只用过去数据）
pct_window = 750
pct_min_periods = 250

# ---------------------------------------------------------------------
# 主题组合（申万一级行业代码，申万2021版）。研究B的“成交占比30%/40%/45%/50%”
# 只对这类组合才有意义——单个一级行业很少超过20%。
# ---------------------------------------------------------------------
[groups]
TMT = ["801080", "801750", "801770", "801760"]          # 电子 计算机 通信 传媒
"新能源" = ["801730"]                                        # 电力设备
"高端制造" = ["801890", "801740", "801880"]                  # 机械 军工 汽车
"周期" = ["801950", "801960", "801050", "801040", "801030", "801710"]  # 煤炭 石油石化 有色 钢铁 基础化工 建材
"大消费" = ["801120", "801110", "801150", "801980", "801210", "801130", "801200"]  # 食饮 家电 医药 美护 社服 纺服 商贸
"大金融" = ["801780", "801790", "801180"]                    # 银行 非银 地产
"稳定" = ["801160", "801170", "801720"]                      # 公用 交运 建筑装饰

# ---------------------------------------------------------------------
[lifecycle]   # 研究A
# 相对强弱线 RS = 行业指数 / 市场基准；在 log(RS) 上做 zigzag 识别波段
rs_swing = 0.20            # 反转确认阈值：RS 从极值回撤/反弹 20% 才确认拐点
min_excess = 0.30          # 波段最低超额涨幅（谷→峰），达到才算“主线”
min_days = 20              # 波段最短交易日
top_rank = 3               # 上涨段内至少有一天 60日超额收益排名进入前 N
start_excess_20d = 0.05    # “首次超额出现”：20日超额收益首次 ≥ 5%
accel_excess_20d = 0.15    # “加速”：20日超额收益首次 ≥ 15%
crowd_pct = 0.95           # “拥挤”：成交占比处于自身过去3年 95% 分位以上

[crowding]    # 研究B
abs_thresholds = [0.30, 0.40, 0.45, 0.50]
rel_pct_thresholds = [0.90, 0.95, 0.99]
rearm_gap = 0.05           # 占比回落到 (阈值-5pp) 以下才允许下一次触发
rel_rearm_gap = 0.10       # 分位数阈值的重置间隔
min_gap_days = 20          # 两次事件至少间隔 20 个交易日
include_single_sectors = true
# 个股成交集中度（需要个股数据）：成交额前 5% 个股占全A成交额比重
concentration_top = 0.05
concentration_thresholds = [0.40, 0.45, 0.50]

[crash]       # 研究C
drop_thresholds = [0.05, 0.07, 0.10]
sigma_multiples = [3.0, 4.0]   # 波动率标准化的大跌：跌幅 ≥ k × 20日波动率
strong_top_k = 5           # “强势板块”：前一日 60日超额收益排名前 5
strong_min_exc60 = 0.10    #              且 60日超额收益 ≥ 10%
min_gap_days = 10          # 同一行业 10 日内的连续大跌算同一事件
recover_days = 20          # “机会”：20 日内收复大跌前收盘价，且 20日超额 > 0
end_days = 60              # “趋势结束”：60 日内 RS 未创新高，且 60日超额 < 0

[style]       # 研究D
growth = "399370"          # 国证成长
value = "399371"           # 国证价值
extra_pairs = [["000852", "000300"]]   # 小盘/大盘：中证1000 vs 沪深300
swing = 0.10               # 风格相对线 zigzag 阈值
min_days = 40              # 风格段最短 40 个交易日（过滤噪音切换）
horizons = [20, 60, 120]
alarm_hi = 0.90            # 预警：信号分位数 ≥ 90% 预示成长→价值
alarm_lo = 0.10            #       信号分位数 ≤ 10% 预示价值→成长
alarm_window = 60          # 预警后 60 日内发生切换算命中
growth_group = "TMT"       # 成长拥挤度用哪个主题组合的成交占比

[diffusion]   # 研究E
small_index = "399303"     # 国证2000（无个股数据时的“小票/垃圾股”代理）
large_index = "000300"
market_swing = 0.15        # 市场顶部识别阈值
leader_pct = 0.80          # 行业内流通市值前 20% 且盈利 = 龙头/中军
second_pct = 0.40          # 40%-80% 且盈利 = 二线；其余（小市值或亏损）= 尾部
reform_days = 20           # 分层每 20 个交易日重建一次（只用当时可得信息）
signal_window = 10         # 扩散指标：尾部 − 龙头 的 10 日收益差
signal_pct = 0.90
alarm_window = 40

[regime]      # 研究F
ma_window = 250
ma_slope_window = 20
mom_window = 120
mom_up = 0.15
mom_down = -0.15
oracle_window = 120        # 事后标签：未来 120 日涨跌（仅作上限对照，不可交易）
min_persist = 10           # 新环境连续出现 10 天才确认切换（因果平滑，避免在年线附近来回抖动）
cost_bps = 10              # 单边交易成本（指数/ETF 口径）
momentum_top = 5
reversal_bottom = 5
rebalance_days = 5
dip_threshold = -0.05
dip_hold = 10
dividend_index = "000922"  # 中证红利
small_index = "000852"     # 中证1000
defensive_group = "稳定"    # 无红利指数时的防御组合
